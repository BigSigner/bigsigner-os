# udhcpd config for the usb0 gadget interface (USB relay). Only started when
# no DHCP server answers on usb0 first (see S35network). The Pi hands out an
# address on 10.55.0.0/29 so the host can reach root@10.55.0.1. It does not
# advertise itself as the default router or DNS server, so the host keeps
# its normal internet connection.
start		10.55.0.2
end		10.55.0.6
interface	usb0
lease_file	/var/lib/misc/udhcpd.leases
option		subnet	255.255.255.248
option		lease	3600
